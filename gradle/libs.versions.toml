[versions]
compileSdk = "34"
minSdk = "24"
agp = "8.5.1" # https://maven.google.com/web/index.html?q=gradle.plugin#com.android.library:com.android.library.gradle.plugin
kotlin = "1.9.20"
dokka = "1.9.10"
jsoup = "1.18.1" # https://github.com/jhy/jsoup/releases
mavenPublish = "0.25.3"
ktor = "2.3.7" # https://github.com/ktorio/ktor/releases
assertk = "0.28.0"  # https://github.com/willowtreeapps/assertk/releases
aedile = "1.3.1"  # https://github.com/sksamuel/aedile/releases
testResources = "0.4.0"
kotlinx-coroutines = "1.7.3"  # https://github.com/kotlin/kotlinx.coroutines/releases
okhttp = "4.12.0" # https://square.github.io/okhttp/changelogs/changelog. Updating to 5.x? See cli/build.gradle.kts.
testParameterInjector = "1.8"
clikt = "3.5.2"
mordant = "2.0.0-beta13"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
mavenPublish = { id = "com.vanniktech.maven.publish.base", version.ref = "mavenPublish" }
testResources = { id = "com.goncalossilva.resources", version.ref = "testResources" }

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockWebServer = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }
aedile = { module = "com.sksamuel.aedile:aedile-core", version.ref = "aedile" }
testResources = { module = "com.goncalossilva:resources", version.ref = "testResources" }
testParameterInjector = { module = "com.google.testparameterinjector:test-parameter-injector", version.ref = "testParameterInjector" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
